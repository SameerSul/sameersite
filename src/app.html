<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"
        integrity="sha512-Kef5sc7gfTacR7TZKelcrRs15ipf7+t+n7Zh6mKNJbmW+/RRdCW9nwfLn4YX0s2nO6Kv5Y2ChqgIakaC6PW09A=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="bg-zinc-950 text-zinc-300 antialiased">
    <div id="particles-js" class="fixed inset-0 z-0 opacity-40 pointer-events-none"></div>

    <div class="relative z-10">%sveltekit.body%</div>

    <script>
        // Ensure the path to particles.json is correct relative to your static folder
        // Usually, putting it in static/particles.json means the path is just "/particles.json"
        particlesJS.load("particles-js", "/particles.json", function () {
            console.log("Particles loaded");
        });
    </script>
</body>
</html>
