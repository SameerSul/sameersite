name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    - run: npm ci
    - run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    # Login to Docker Hub using secrets from: Repository Settings → Secrets and variables → Actions
    # DOCKERHUB_USERNAME: Your Docker Hub username (lowercase)
    # DOCKERHUB_TOKEN: Access token from Docker Hub → Account Settings → Security → New Access Token
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    # Pushes to: dockerhub.com/r/[username]/sameersite
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/sameersite:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/sameersite:${{ github.sha }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    
    # Cloudflare secrets from: Repository Settings → Secrets and variables → Actions
    # CLOUDFLARE_API_TOKEN: From Cloudflare → My Profile → API Tokens
    # CLOUDFLARE_ACCOUNT_ID: From Cloudflare → Right sidebar of dashboard
    - name: Deploy to Cloudflare Pages
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: sameersite
        directory: build